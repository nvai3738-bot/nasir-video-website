‎<!DOCTYPE html>
‎<html lang="bn">
‎<head>
‎  <meta charset="UTF-8">
‎  <meta name="viewport" content="width=device-width, initial-scale=1">
‎  <title>Nasir Video Website</title>
‎  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
‎  <style>
‎    * { box-sizing: border-box; }
‎    body {
‎      margin: 0; background: #101010; color: white;
‎      font-family: Arial, sans-serif;
‎    }
‎    header {
‎      background: #087f5b; text-align: center; padding: 22px 10px;
‎    }
‎    h1 { margin: 0; font-size: 26px; }
‎    .container { max-width: 800px; margin: 20px auto; padding: 15px; }
‎    .panel, .video-card {
‎      background: #202020; padding: 15px; border-radius: 12px; margin-bottom: 16px;
‎    }
‎    input {
‎      width: 100%; padding: 12px; margin: 7px 0;
‎      border-radius: 7px; border: 1px solid #555; background: #151515; color: white;
‎    }
‎    button {
‎      background: #087f5b; color: white; border: 0; padding: 12px 16px;
‎      border-radius: 7px; cursor: pointer; margin: 5px 3px 5px 0;
‎    }
‎    button:disabled { opacity: .5; }
‎    video { width: 100%; display: block; background: black; border-radius: 8px; }
‎    h2 { font-size: 18px; overflow-wrap: anywhere; }
‎    #status { white-space: pre-wrap; overflow-wrap: anywhere; color: #9ee7c5; }
‎    .hidden { display: none; }
‎    footer { text-align: center; color: #aaa; padding: 20px; }
‎  </style>
‎</head>
‎<body>
‎<header>
‎  <h1>Nasir Video Website</h1>
‎  <p>আমার ভিডিও সংগ্রহ</p>
‎</header>
‎
‎<main class="container">
‎  <section class="panel">
‎    <h2>🔐 Admin Login</h2>
‎    <form id="loginForm">
‎      <input id="email" type="email" placeholder="Admin email" required>
‎      <input id="password" type="password" placeholder="Password" required>
‎      <button type="submit">Login</button>
‎    </form>
‎    <div id="adminPanel" class="hidden">
‎      <p>Admin হিসেবে লগইন করা হয়েছে।</p>
‎      <input id="videoFile" type="file" accept="video/*">
‎      <button id="uploadBtn" type="button">⬆️ ভিডিও আপলোড</button>
‎      <button id="logoutBtn" type="button">Logout</button>
‎    </div>
‎    <p id="status" role="status">ওয়েবসাইট প্রস্তুত হচ্ছে...</p>
‎  </section>
‎
‎  <h2>🎬 সব ভিডিও</h2>
‎  <section id="videoList">ভিডিও খোঁজা হচ্ছে...</section>
‎</main>
‎
‎<footer>© 2026 Nasir Video Website</footer>
‎
‎<script>
‎  // এখানে নিজের Supabase Project URL এবং Publishable Key বসাও।
‎  const SUPABASE_URL = "https://cvvttwjqbxlojfkktxzo.supabase.co";
‎  const SUPABASE_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";
‎  const BUCKET = "videos";
‎
‎  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
‎  const statusBox = document.getElementById("status");
‎  const adminPanel = document.getElementById("adminPanel");
‎  const loginForm = document.getElementById("loginForm");
‎  const videoList = document.getElementById("videoList");
‎  const uploadBtn = document.getElementById("uploadBtn");
‎
‎  function status(message) {
‎    statusBox.textContent = message;
‎  }
‎
‎  async function loadVideos() {
‎    videoList.textContent = "ভিডিও লোড হচ্ছে...";
‎
‎    const { data, error } = await db.storage.from(BUCKET).list("", {
‎      limit: 1000,
‎      sortBy: { column: "created_at", order: "desc" }
‎    });
‎
‎    if (error) {
‎      videoList.textContent = "ভিডিও লোড হয়নি: " + error.message;
‎      return;
‎    }
‎
‎    const videos = (data || []).filter(file =>
‎      /\.(mp4|webm|ogg|mov|m4v)$/i.test(file.name)
‎    );
‎
‎    videoList.replaceChildren();
‎
‎    if (!videos.length) {
‎      videoList.textContent = "কোনো ভিডিও পাওয়া যায়নি।";
‎      return;
‎    }
‎
‎    videos.forEach(file => {
‎      const url = db.storage.from(BUCKET).getPublicUrl(file.name).data.publicUrl;
‎      const card = document.createElement("article");
‎      card.className = "video-card";
‎
‎      const title = document.createElement("h2");
‎      title.textContent = file.name;
‎
‎      const player = document.createElement("video");
‎      player.controls = true;
‎      player.playsInline = true;
‎      player.preload = "metadata";
‎      player.src = url;
‎
‎      card.append(title, player);
‎      videoList.append(card);
‎    });
‎  }
‎
‎  loginForm.addEventListener("submit", async event => {
‎    event.preventDefault();
‎    status("লগইন হচ্ছে...");
‎
‎    const { error } = await db.auth.signInWithPassword({
‎      email: document.getElementById("email").value.trim(),
‎      password: document.getElementById("password").value
‎    });
‎
‎    if (error) {
‎      status("লগইন হয়নি: " + error.message);
‎      return;
‎    }
‎
‎    status("লগইন সফল হয়েছে।");
‎    updateLoginUI(true);
‎  });
‎
‎  function updateLoginUI(isLoggedIn) {
‎    adminPanel.classList.toggle("hidden", !isLoggedIn);
‎    loginForm.classList.toggle("hidden", isLoggedIn);
‎  }
‎
‎  document.getElementById("logoutBtn").addEventListener("click", async () => {
‎    const { error } = await db.auth.signOut();
‎    if (error) {
‎      status("Logout হয়নি: " + error.message);
‎      return;
‎    }
‎    updateLoginUI(false);
‎    status("Logout হয়েছে।");
‎  });
‎
‎  uploadBtn.addEventListener("click", async () => {
‎    const file = document.getElementById("videoFile").files[0];
‎    if (!file) {
‎      status("আগে একটি ভিডিও নির্বাচন করো।");
‎      return;
‎    }
‎
‎    const { data: sessionData } = await db.auth.getSession();
‎    if (!sessionData.session) {
‎      updateLoginUI(false);
‎      status("আগে Admin Login করো।");
‎      return;
‎    }
‎
‎    if (!file.type.startsWith("video/")) {
‎      status("একটি ভিডিও ফাইল নির্বাচন করো।");
‎      return;
‎    }
‎
‎    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
‎    const path = Date.now() + "-" + safeName;
‎
‎    uploadBtn.disabled = true;
‎    status("ভিডিও আপলোড হচ্ছে... অপেক্ষা করো।");
‎
‎    try {
‎      const { error } = await db.storage.from(BUCKET).upload(path, file, {
‎        contentType: file.type,
‎        upsert: false
‎      });
‎
‎      if (error) throw error;
‎
‎      status("ভিডিও আপলোড সফল হয়েছে!");
‎      document.getElementById("videoFile").value = "";
‎      await loadVideos();
‎    } catch (error) {
‎      status("আপলোড হয়নি: " + error.message);
‎    } finally {
‎      uploadBtn.disabled = false;
‎    }
‎  });
‎
‎  db.auth.onAuthStateChange((_event, session) => {
‎    updateLoginUI(!!session);
‎  });
‎
‎  async function start() {
‎    if (SUPABASE_KEY === "‎sb_publishable_VdNFIUROKpE_EPQPpiWTUg_CdDvvd-R") {
‎      status("প্রথমে কোডে নিজের Publishable Key বসাও।");
‎      videoList.textContent = "কী বসানোর পর ভিডিও লোড হবে।";
‎      return;
‎    }
‎
‎    const { data, error } = await db.auth.getSession();
‎    if (error) status("লগইন অবস্থা পড়া যায়নি: " + error.message);
‎    updateLoginUI(!!data?.session);
‎    await loadVideos();
‎  }
‎
‎  start();
‎</script>
‎</body>
‎</html>
