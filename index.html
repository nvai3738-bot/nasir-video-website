
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nasir Video Website</title>
  <style>
    body {
      margin: 0;
      background: #101010;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      background: #087f5b;
      padding: 20px;
      text-align: center;
    }
    .container {
      padding: 16px;
      max-width: 850px;
      margin: auto;
    }
    h2 { color: #00e6a0; }
    .video {
      background: #222;
      padding: 12px;
      margin-bottom: 18px;
      border-radius: 10px;
    }
    video {
      width: 100%;
      max-height: 480px;
      border-radius: 8px;
      background: #000;
    }
    .message {
      color: #ccc;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <header>
    <h1>Nasir Video Website</h1>
    <p>Welcome to my website ❤️</p>
  </header>

  <main class="container">
    <h2>Latest Videos</h2>
    <p id="status" class="message">ভিডিও লোড হচ্ছে...</p>
    <div id="videos"></div>
  </main>

  <script>
    const SUPABASE_URL =
      "https://cvvttwjqbxlojfkktxzo.supabase.co";

    // এখানে Supabase-এর Publishable key বসাবে
    const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

    const BUCKET = "videos";
    const videosBox = document.getElementById("videos");
    const status = document.getElementById("status");

    async function loadVideos() {
      status.textContent = "ভিডিও লোড হচ্ছে...";
      videosBox.replaceChildren();

      try {
        const response = await fetch(
          `${SUPABASE_URL}/storage/v1/object/list/${BUCKET}`,
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            },
            body: JSON.stringify({
              prefix: "",
              limit: 100,
              offset: 0,
              sortBy: {
                column: "created_at",
                order: "desc"
              }
            })
          }
        );

        if (!response.ok) {
          throw new Error(
            "ভিডিওর তালিকা আনা যায়নি (" +
            response.status + ")"
          );
        }

        const files = await response.json();

        const videoFiles = files.filter(file =>
          file.name &&
          /\.(mp4|webm|ogg|mov|m4v)$/i.test(file.name)
        );

        if (videoFiles.length === 0) {
          status.textContent =
            "এখনো কোনো ভিডিও পাওয়া যায়নি।";
          return;
        }

        for (const file of videoFiles) {
          const url = SUPABASE_URL +
            "/storage/v1/object/public/" +
            BUCKET + "/" +
            file.name.split("/").map(encodeURIComponent).join("/");

          const card = document.createElement("section");
          card.className = "video";

          const player = document.createElement("video");
          player.controls = true;
          player.playsInline = true;
          player.preload = "metadata";
          player.src = url;

          const title = document.createElement("p");
          title.textContent = file.name.replace(/\.[^.]+$/, "");

          card.append(player, title);
          videosBox.appendChild(card);
        }

        status.textContent =
          "মোট " + videoFiles.length + "টি ভিডিও";

      } catch (error) {
        status.textContent =
          error.message +
          "। Publishable key এবং Storage permission পরীক্ষা করো।";
      }
    }

    loadVideos();
  </script>
</body>
</html>
