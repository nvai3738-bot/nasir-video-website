<!DOCTYPE html>
‎<html lang="bn">
‎<head>
‎<meta charset="UTF-8">
‎<meta name="viewport" content="width=device-width, initial-scale=1">
‎<title>Nasir Video Website</title>
‎<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
‎<style>
‎*{box-sizing:border-box}
‎body{margin:0;background:#101510;color:#fff;font-family:Arial,sans-serif}
‎header{background:#087f5b;padding:22px 14px;text-align:center}
‎header h1{margin:0;font-size:27px}
‎header p{margin:8px 0 0}
‎main{max-width:850px;margin:auto;padding:16px}
‎.panel{background:#1c261f;padding:16px;border-radius:12px;margin:16px 0}
‎input,button{width:100%;padding:12px;margin:6px 0;border-radius:7px;font-size:16px}
‎input{background:#fff;color:#111;border:1px solid #aaa}
‎button{background:#087f5b;color:white;border:0;font-weight:bold}
‎button:active{opacity:.8}
‎.small{font-size:14px;color:#ccc}
‎#status{overflow-wrap:anywhere;color:#b7f7cf}
‎#videos{display:grid;grid-template-columns:1fr;gap:16px}
‎.video{background:#202820;border-radius:12px;padding:12px;overflow:hidden}
‎video{width:100%;max-height:420px;background:#000;border-radius:8px}
‎.video h3{font-size:16px;overflow-wrap:anywhere}
‎.hidden{display:none}
‎footer{text-align:center;padding:25px;color:#aaa}
‎@media(min-width:600px){#videos{grid-template-columns:1fr 1fr}}
‎</style>
‎</head>
‎<body>
‎<header>
‎<h1>🎬 Nasir Video Website</h1>
‎<p>আমার ভিডিও সংগ্রহ</p>
‎</header>
‎
‎<main>
‎<section class="panel">
‎<h2>🔐 Admin Login</h2>
‎<form id="loginForm">
‎<input id="email" type="email" placeholder="Admin email" required>
‎<input id="password" type="password" placeholder="Password" required>
‎<button type="submit">Login</button>
‎</form>
‎<button id="logout" class="hidden" type="button">Logout</button>
‎
‎<div id="admin" class="hidden">
‎<h3>📤 নতুন ভিডিও আপলোড</h3>
‎<input id="file" type="file" accept="video/*">
‎<button id="upload" type="button">⬆️ ভিডিও আপলোড</button>
‎</div>
‎<p id="status" role="status">ওয়েবসাইট প্রস্তুত হচ্ছে...</p>
‎</section>
‎
‎<h2>🎬 সব ভিডিও</h2>
‎<p class="small">আপনার Storage-এর ভিডিওগুলো এখানে দেখাবে।</p>
‎<div id="videos"></div>
‎<button id="refresh" type="button">🔄 ভিডিও আবার লোড করুন</button>
‎</main>
‎
‎<footer>© 2026 Nasir Video Website</footer>
‎
‎<script>
‎const SUPABASE_URL = "https://cvvttwjqbxlojfkktxzo.supabase.co";
‎const SUPABASE_KEY = "sb_publishable_VdNFIUROKpE_EPQPpiWTUg_CdDvvd-R";
‎const BUCKET = "videos";
‎
‎const db = window.supabase.createClient(
‎  SUPABASE_URL, SUPABASE_KEY
‎);
‎
‎const $ = id => document.getElementById(id);
‎function message(text){ $("status").textContent = text; }
‎
‎async function updateAuth(){
‎  const {data, error} = await db.auth.getSession();
‎  if(error){message("লগইন অবস্থা দেখা যায়নি: "+error.message);return;}
‎  const loggedIn = !!data.session;
‎  $("loginForm").classList.toggle("hidden", loggedIn);
‎  $("logout").classList.toggle("hidden", !loggedIn);
‎  $("admin").classList.toggle("hidden", !loggedIn);
‎  if(loggedIn) message("Admin হিসেবে লগইন করা হয়েছে।");
‎}
‎
‎$("loginForm").addEventListener("submit", async e=>{
‎  e.preventDefault();
‎  message("লগইন হচ্ছে...");
‎  const {error} = await db.auth.signInWithPassword({
‎    email:$("email").value.trim(),
‎    password:$("password").value
‎  });
‎  if(error){message("লগইন ব্যর্থ: "+error.message);return;}
‎  await updateAuth();
‎});
‎
‎$("logout").addEventListener("click", async ()=>{
‎  const {error} = await db.auth.signOut();
‎  if(error){message("Logout সমস্যা: "+error.message);return;}
‎  await updateAuth();
‎  message("Logout হয়েছে।");
‎});
‎
‎async function loadVideos(){
‎  const area=$("videos");
‎  area.replaceChildren();
‎  message("ভিডিও লোড হচ্ছে...");
‎
‎  const {data,error}=await db.storage.from(BUCKET).list("",{
‎    limit:1000,
‎    sortBy:{column:"created_at",order:"desc"}
‎  });
‎
‎  if(error){
‎    message("ভিডিও তালিকা লোড হয়নি: "+error.message+
‎      " — Storage-এর SELECT policy পরীক্ষা করুন।");
‎    return;
‎  }
‎
‎  const files=(data||[]).filter(f=>
‎    f.name && /\.(mp4|webm|mov|m4v|ogv)$/i.test(f.name)
‎  );
‎
‎  if(!files.length){
‎    message("কোনো ভিডিও তালিকায় নেই। Bucket ও Storage policy পরীক্ষা করুন।");
‎    return;
‎  }
‎
‎  files.forEach(f=>{
‎    const url=db.storage.from(BUCKET).getPublicUrl(f.name).data.publicUrl;
‎    const card=document.createElement("article");
‎    card.className="video";
‎    const title=document.createElement("h3");
‎    title.textContent=f.name;
‎    const player=document.createElement("video");
‎    player.controls=true;
‎    player.playsInline=true;
‎    player.preload="metadata";
‎    player.src=url;
‎    card.append(title,player);
‎    area.append(card);
‎  });
‎  message("মোট "+files.length+"টি ভিডিও পাওয়া গেছে।");
‎}
‎
‎$("upload").addEventListener("click",async ()=>{
‎  const file=$("file").files[0];
‎  if(!file){message("আগে একটি ভিডিও বেছে নিন।");return;}
‎  if(!file.type.startsWith("video/")){
‎    message("একটি ভিডিও ফাইল বেছে নিন।");return;
‎  }
‎
‎  const {data:auth}=await db.auth.getSession();
‎  if(!auth.session){message("আগে Admin Login করুন।");return;}
‎
‎  const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
‎  const path=Date.now()+"_"+safeName;
‎  $("upload").disabled=true;
‎  message("ভিডিও আপলোড হচ্ছে... অপেক্ষা করুন।");
‎
‎  try{
‎    const {error}=await db.storage.from(BUCKET).upload(path,file,{
‎      contentType:file.type,
‎      upsert:false
‎    });
‎    if(error) throw error;
‎
‎    $("file").value="";
‎    message("ভিডিও আপলোড হয়েছে! তালিকা আপডেট হচ্ছে...");
‎    await loadVideos();
‎  }catch(err){
‎    message("আপলোড ব্যর্থ: "+err.message+
‎      " — Storage INSERT policy ও ফাইলের সাইজ পরীক্ষা করুন।");
‎  }finally{
‎    $("upload").disabled=false;
‎  }
‎});
‎
‎$("refresh").addEventListener("click",loadVideos);
‎
‎db.auth.onAuthStateChange(()=>{
‎  setTimeout(updateAuth,0);
‎});
‎
‎(async()=>{
‎  await updateAuth();
‎  await loadVideos();
‎})();
‎</script>
‎</body>
‎</html>
