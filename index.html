‎<!DOCTYPE html>
‎<html lang="bn">
‎<head>
‎  <meta charset="UTF-8">
‎  <meta name="viewport" content="width=device-width, initial-scale=1">
‎  <title>Nasir Video Website</title>
‎  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
‎  <style>
‎    * { box-sizing: border-box; }
‎    body {
‎      margin: 0;
‎      background: #101010;
‎      color: white;
‎      font-family: Arial, sans-serif;
‎    }
‎    header {
‎      background: #087f5b;
‎      text-align: center;
‎      padding: 22px 10px;
‎    }
‎    h1 { margin: 0; font-size: 26px; }
‎    .container {
‎      max-width: 800px;
‎      margin: 20px auto;
‎      padding: 15px;
‎    }
‎    .panel, .video-card {
‎      background: #202020;
‎      padding: 15px;
‎      border-radius: 12px;
‎      margin-bottom: 16px;
‎    }
‎    input {
‎      width: 100%;
‎      padding: 12px;
‎      margin: 7px 0;
‎      border-radius: 7px;
‎      border: 1px solid #555;
‎      background: #151515;
‎      color: white;
‎    }
‎    button {
‎      background: #087f5b;
‎      color: white;
‎      border: 0;
‎      padding: 12px 16px;
‎      border-radius: 7px;
‎      cursor: pointer;
‎      margin: 5px 3px 5px 0;
‎    }
‎    button:disabled { opacity: .5; }
‎    video {
‎      width: 100%;
‎      display: block;
‎      background: black;
‎      border-radius: 8px;
‎    }
‎    h2 { font-size: 18px; overflow-wrap: anywhere; }
‎    #status {
‎      white-space: pre-wrap;
‎      overflow-wrap: anywhere;
‎      color: #9ee7c5;
‎    }
‎    .hidden { display: none !important; }
‎    footer {
‎      text-align: center;
‎      color: #aaa;
‎      padding: 20px;
‎    }
‎  </style>
‎</head>
‎<body>
‎<header>
‎  <h1>Nasir Video Website</h1>
‎  <p>আমার ভিডিও সংগ্রহ</p>
‎</header>
‎
‎<main class="container">
‎  <section class="panel">
‎    <h2>🔐 Admin Login</h2>
‎
‎    <form id="loginForm">
‎      <input id="email" type="email"
‎        placeholder="Admin email" required>
‎      <input id="password" type="password"
‎        placeholder="Password" required>
‎      <button id="loginBtn" type="submit">Login</button>
‎    </form>
‎
‎    <div id="adminPanel" class="hidden">
‎      <p>Admin হিসেবে লগইন করা হয়েছে।</p>
‎      <input id="videoFile" type="file"
‎        accept="video/*">
‎      <button id="uploadBtn" type="button">
‎        ⬆️ ভিডিও আপলোড
‎      </button>
‎      <button id="logoutBtn" type="button">Logout</button>
‎    </div>
‎
‎    <p id="status" role="status">ওয়েবসাইট প্রস্তুত হচ্ছে...</p>
‎  </section>
‎
‎  <h2>🎬 সব ভিডিও</h2>
‎  <section id="videoList">ভিডিও লোড হচ্ছে...</section>
‎</main>
‎
‎<footer>© 2026 Nasir Video Website</footer>
‎
‎<script>
‎const SUPABASE_URL =
‎  "https://cvvttwjqbxlojfkktxzo.supabase.co";
‎
‎const SUPABASE_KEY =
‎  "sb_publishable_VdNFIUROKpE_EPQPpiWTUg_CdDvvd-R";
‎
‎const BUCKET = "videos";
‎
‎// তোমার Supabase Auth User ID
‎const ADMIN_UID = "792440e2-6849-466d-baf8-c8d38a49e5d6";
‎
‎const db = window.supabase.createClient(
‎  SUPABASE_URL,
‎  SUPABASE_KEY
‎);
‎
‎const $ = id => document.getElementById(id);
‎const statusBox = $("status");
‎const loginForm = $("loginForm");
‎const adminPanel = $("adminPanel");
‎const videoList = $("videoList");
‎const loginBtn = $("loginBtn");
‎const uploadBtn = $("uploadBtn");
‎
‎function status(message) {
‎  statusBox.textContent = message;
‎}
‎
‎function updateLoginUI(session) {
‎  const isAdmin =
‎    !!session && session.user.id === ADMIN_UID;
‎
‎  adminPanel.classList.toggle("hidden", !isAdmin);
‎  loginForm.classList.toggle("hidden", isAdmin);
‎
‎  if (session && !isAdmin) {
‎    status("এই অ্যাকাউন্টটি অ্যাডমিন নয়।");
‎  }
‎
‎  return isAdmin;
‎}
‎
‎async function loadVideos() {
‎  videoList.textContent = "ভিডিও লোড হচ্ছে...";
‎
‎  try {
‎    const { data, error } = await db.storage
‎      .from(BUCKET)
‎      .list("", {
‎        limit: 1000,
‎        sortBy: {
‎          column: "created_at",
‎          order: "desc"
‎        }
‎      });
‎
‎    if (error) throw error;
‎
‎    const videos = (data || []).filter(file =>
‎      /\.(mp4|webm|ogg|mov|m4v)$/i.test(file.name)
‎    );
‎
‎    videoList.replaceChildren();
‎
‎    if (videos.length === 0) {
‎      videoList.textContent =
‎        "কোনো ভিডিও পাওয়া যায়নি। Storage Policy পরীক্ষা করো।";
‎      return;
‎    }
‎
‎    for (const file of videos) {
‎      const { data: publicData } = db.storage
‎        .from(BUCKET)
‎        .getPublicUrl(file.name);
‎
‎      const card = document.createElement("article");
‎      card.className = "video-card";
‎
‎      const title = document.createElement("h2");
‎      title.textContent = file.name;
‎
‎      const player = document.createElement("video");
‎      player.controls = true;
‎      player.playsInline = true;
‎      player.preload = "metadata";
‎      player.src = publicData.publicUrl;
‎
‎      card.append(title, player);
‎      videoList.append(card);
‎    }
‎  } catch (error) {
‎    videoList.textContent =
‎      "ভিডিও লোড হয়নি: " + error.message;
‎  }
‎}
‎
‎loginForm.addEventListener("submit", async event => {
‎  event.preventDefault();
‎  loginBtn.disabled = true;
‎  status("লগইন হচ্ছে...");
‎
‎  try {
‎    const { data, error } = await db.auth
‎      .signInWithPassword({
‎        email: $("email").value.trim(),
‎        password: $("password").value
‎      });
‎
‎    if (error) throw error;
‎
‎    if (!updateLoginUI(data.session)) {
‎      await db.auth.signOut();
‎      status("এই অ্যাকাউন্টটি অ্যাডমিন নয়।");
‎      return;
‎    }
‎
‎    status("অ্যাডমিন লগইন সফল হয়েছে!");
‎  } catch (error) {
‎    status("লগইন হয়নি: " + error.message);
‎  } finally {
‎    loginBtn.disabled = false;
‎  }
‎});
‎
‎$("logoutBtn").addEventListener("click", async () => {
‎  const { error } = await db.auth.signOut();
‎
‎  if (error) {
‎    status("Logout হয়নি: " + error.message);
‎    return;
‎  }
‎
‎  updateLoginUI(null);
‎  status("Logout হয়েছে।");
‎});
‎
‎uploadBtn.addEventListener("click", async () => {
‎  const file = $("videoFile").files[0];
‎
‎  if (!file) {
‎    status("আগে একটি ভিডিও নির্বাচন করো।");
‎    return;
‎  }
‎
‎  if (!file.type.startsWith("video/")) {
‎    status("একটি ভিডিও ফাইল নির্বাচন করো।");
‎    return;
‎  }
‎
‎  uploadBtn.disabled = true;
‎
‎  try {
‎    const { data: authData, error: authError } =
‎      await db.auth.getSession();
‎
‎    if (authError) throw authError;
‎
‎    const session = authData.session;
‎
‎    if (!session || session.user.id !== ADMIN_UID) {
‎      updateLoginUI(session);
‎      throw new Error("আগে সঠিক Admin Login করো।");
‎    }
‎
‎    const safeName = file.name.replace(
‎      /[^a-zA-Z0-9._-]/g, "_"
‎    );
‎
‎    const path = Date.now() + "-" + safeName;
‎
‎    status("ভিডিও আপলোড হচ্ছে... অপেক্ষা করো।");
‎
‎    const { error } = await db.storage
‎      .from(BUCKET)
‎      .upload(path, file, {
‎        contentType: file.type,
‎        upsert: false
‎      });
‎
‎    if (error) throw error;
‎
‎    status("ভিডিও আপলোড সফল হয়েছে!");
‎    $("videoFile").value = "";
‎    await loadVideos();
‎
‎  } catch (error) {
‎    status("আপলোড হয়নি: " + error.message);
‎  } finally {
‎    uploadBtn.disabled = false;
‎  }
‎});
‎
‎async function start() {
‎  try {
‎    const { data, error } = await db.auth.getSession();
‎
‎    if (error) throw error;
‎
‎    updateLoginUI(data.session);
‎
‎    if (!data.session) {
‎      status("Admin Login করে ভিডিও আপলোড করতে পারো।");
‎    }
‎
‎    await loadVideos();
‎  } catch (error) {
‎    status("সমস্যা: " + error.message);
‎  }
‎}
‎
‎db.auth.onAuthStateChange((event, session) => {
‎  updateLoginUI(session);
‎});
‎
‎start();
‎</script>
‎</body>
‎</html>
